<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Насколько хорошо ты меня знаешь?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <section id="start" class="center">
    <div class="emoji">🤔</div>
    <h1 class="big">Насколько хорошо ты меня знаешь?</h1>
    <p class="sub">5 вопросов. Выбирай ответ и узнай, настоящий ли ты друг!</p>
    <div class="menu">
      <button class="next mode" id="soloBtn" type="button">Играть одному</button>
      <button class="next mode alt" id="duelBtn" type="button">⚔️ Дуэль вдвоём</button>
    </div>
  </section>

  <section id="setup" class="center hidden">
    <div class="emoji">⚔️</div>
    <h1 class="big">Дуэль!</h1>
    <p class="sub">Играете вдвоём на одном телефоне. Вводи имена (можно не вводить).</p>
    <div class="names">
      <input id="n0" class="p0" type="text" maxlength="14" placeholder="Игрок 1" autocomplete="off">
      <input id="n1" class="p1" type="text" maxlength="14" placeholder="Игрок 2" autocomplete="off">
    </div>
    <button class="next" id="goBtn" type="button">Поехали!</button>
  </section>

  <section id="pass" class="center hidden">
    <div class="emoji">📱</div>
    <p class="sub">Передай телефон</p>
    <div class="pass-name" id="passName"></div>
    <p class="sub">Первый игрок не подсматривает! Ответ ещё не показан.</p>
    <button class="next" id="readyBtn" type="button">Я готов!</button>
  </section>

  <section id="game" class="hidden" style="display:flex;flex-direction:column;gap:14px;flex:1">
    <div class="top">
      <div class="pill" id="counter">Вопрос 1 из 5</div>
      <div class="scores" id="scores"></div>
    </div>
    <div class="timer" id="timer"><i id="timerFill"></i><b id="timerText">⏱ 20</b></div>
    <div class="turn hidden" id="turn"></div>
    <div class="tools">
      <button class="hint" id="hintBtn" type="button">💡 50 / 50 <span id="hintLeft">×2</span></button>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="card"><div class="q" id="question"></div></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
  </section>

  <section id="result" class="center hidden">
    <div class="emoji" id="resEmoji"></div>
    <div class="sub" id="resLabel">Твой результат</div>
    <div class="score-big" id="resScore"></div>
    <h2 class="big" id="resTitle"></h2>
    <p class="sub" id="resText"></p>
    <button class="next" id="againBtn" type="button">Играть ещё раз</button>
  </section>

</div>

<button class="mute" id="muteBtn" type="button" aria-label="Звук">🔊</button>

<script src="questions.js"></script>
<script src="script.js"></script>
</body>
</html>
